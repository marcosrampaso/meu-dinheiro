name: Testes

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Dependências dos testes
        run: python -m pip install -r requirements-dev.txt
      - name: Testes Python
        run: python -m unittest discover -s tests -v
      - name: Sintaxe JavaScript
        run: |
          node --check static/app.js
          node --check static/import.js
          node --check static/charts.js
          node --check static/categories.js
          node --check static/webhooks.js
      - name: Scripts compartilhados e avisos da Pluggy
        run: node tests/test_browser_scripts.js
      - name: Dependências do navegador de testes
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Privacidade e layout responsivo
        run: node tests/test_privacy_browser.js
      - name: Criar e acompanhar plano de reserva
        run: node tests/test_plans_browser.js
      - name: Planejar com histórico e revisar categorias
        run: node tests/test_plan_history_browser.js
      - name: Login local por senha
        run: node tests/test_password_browser.js
      - name: Inatividade e sessão após recarregar
        run: node tests/test_idle_session_browser.js
      - name: Aprendizado local e importação histórica
        run: node tests/test_learning_browser.js
      - name: Separação dos gastos por origem
        run: node tests/test_payment_views_browser.js
      - name: Classificar lançamentos e cadastrar receitas esperadas
        run: node tests/test_review_expected_browser.js
